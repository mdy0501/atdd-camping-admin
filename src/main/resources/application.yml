spring:
  application:
    name: camping-admin-service
  
  datasource:
    url: jdbc:mysql://localhost:3307/camping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root1234
  
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
        
server:
  port: 8082
  
logging:
  level:
    com.camping.admin: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: "change-this-dev-secret-key-please"
  expiration-minutes: 30

admin:
  username: admin
  password: admin123